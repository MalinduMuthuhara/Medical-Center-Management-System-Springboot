<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Medicines</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/crud.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        app-sidebar {
            display: contents;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- ================= SIDEBAR ================= -->
    <app-sidebar active="appointmentmedicines"></app-sidebar>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">

        <!-- ================= HEADER ================= -->
        <header class="topbar">
            <div>
                <h1>Appointment Medicines</h1>
                <p>Prescribe medicines against an appointment.</p>
            </div>
        </header>

        <!-- ================= APPOINTMENT MEDICINE FORM ================= -->
        <section class="content-grid single">

            <div class="card">

                <div class="card-header">
                    <h2 id="formTitle">Add Appointment Medicine</h2>
                </div>

                <form id="appointmentMedicineForm">

                    <!-- Appointment Medicine ID -->
                    <input type="hidden" id="appointmentMedicineId" value="0">

                    <div class="form-row">

                        <!-- Appointment -->
                        <div class="form-group">
                            <label for="appointmentId">Appointment</label>
                            <select id="appointmentId" required>
                                <option value="">Select Appointment</option>
                            </select>
                        </div>

                        <!-- Medicine -->
                        <div class="form-group">
                            <label for="medicineId">Medicine</label>
                            <select id="medicineId" required>
                                <option value="">Select Medicine</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-row">

                        <!-- Quantity -->
                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number"
                                   id="quantity"
                                   min="1"
                                   placeholder="Enter quantity"
                                   required>
                        </div>

                    </div>

                    <!-- ================= BUTTONS ================= -->
                    <div class="form-row">

                        <div class="form-actions">

                            <!-- Save -->
                            <button type="submit"
                                    onclick="handleSave(event)"
                                    class="btn btn-primary"
                                    id="saveBtn">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save
                            </button>

                            <!-- Update -->
                            <button type="button"
                                    onclick="handleUpdate(event)"
                                    class="btn btn-success"
                                    id="updateBtn"
                                    style="display: none;">
                                <i class="fa-solid fa-pen-to-square"></i>
                                Update
                            </button>

                            <!-- Delete -->
                            <button type="button"
                                    onclick="handleDelete(event)"
                                    class="btn btn-danger"
                                    id="deleteBtn"
                                    style="display: none;">
                                <i class="fa-solid fa-trash"></i>
                                Delete
                            </button>

                            <!-- Cancel -->
                            <button type="button"
                                    onclick="handleCancel()"
                                    class="btn btn-dark"
                                    id="cancelBtn"
                                    style="display: none;">
                                <i class="fa-solid fa-xmark"></i>
                                Cancel
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </section>

        <!-- ================= APPOINTMENT MEDICINE TABLE ================= -->
        <section class="content-grid single">

            <div class="card">

                <div class="card-header">
                    <h2>All Appointment Medicines</h2>
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Appointment</th>
                            <th>Medicine</th>
                            <th>Quantity</th>
                        </tr>
                        </thead>

                        <tbody id="appointmentMedicineTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>

<!-- ================= JQUERY ================= -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- ================= SIDEBAR ================= -->
<script src="js/sidebar.js?v=2"></script>

<!-- ================= SWEETALERT2 ================= -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ================= APPOINTMENT MEDICINE ================= -->
<script src="js/custom/appointmentmedicine.js"></script>

</body>
</html>
