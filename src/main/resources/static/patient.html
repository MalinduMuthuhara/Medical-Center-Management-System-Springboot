<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/crud.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        app-sidebar {
            display: contents;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- ================= SIDEBAR ================= -->
    <app-sidebar active="patients"></app-sidebar>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">

        <!-- ================= HEADER ================= -->
        <header class="topbar">
            <div>
                <h1>Patients</h1>
                <p>View, add, edit, and remove patients.</p>
            </div>
        </header>

        <!-- ================= PATIENT FORM ================= -->
        <section class="content-grid single">

            <div class="card">

                <div class="card-header">
                    <h2 id="formTitle">Add Patient</h2>
                </div>

                <form id="patientForm">

                    <!-- Patient ID -->
                    <input type="hidden" id="patientId" value="0">

                    <div class="form-row">

                        <!-- Full Name -->
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text"
                                   id="fullName"
                                   placeholder="Enter patient full name"
                                   required>
                        </div>

                        <!-- Age -->
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number"
                                   id="age"
                                   placeholder="Enter patient age"
                                   min="0"
                                   required>
                        </div>

                    </div>

                    <div class="form-row">

                        <!-- Gender -->
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" required>
                                <option value="">Select Gender</option>
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                            </select>
                        </div>

                        <!-- Ward -->
                        <div class="form-group">
                            <label for="wardId">Ward</label>
                            <select id="wardId" required>
                                <option value="">Select Ward</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-row">

                        <!-- Address -->
                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text"
                                   id="address"
                                   placeholder="Enter patient address"
                                   required>
                        </div>

                    </div>

                    <!-- ================= BUTTONS ================= -->
                    <div class="form-row">

                        <div class="form-actions">

                            <!-- Save -->
                            <button type="submit"
                                    onclick="handleSave(event)"
                                    class="btn btn-primary"
                                    id="saveBtn">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save
                            </button>

                            <!-- Update -->
                            <button type="button"
                                    onclick="handleUpdate(event)"
                                    class="btn btn-success"
                                    id="updateBtn"
                                    style="display: none;">
                                <i class="fa-solid fa-pen-to-square"></i>
                                Update
                            </button>

                            <!-- Delete -->
                            <button type="button"
                                    onclick="handleDelete(event)"
                                    class="btn btn-danger"
                                    id="deleteBtn"
                                    style="display: none;">
                                <i class="fa-solid fa-trash"></i>
                                Delete
                            </button>

                            <!-- Cancel -->
                            <button type="button"
                                    onclick="handleCancel()"
                                    class="btn btn-dark"
                                    id="cancelBtn"
                                    style="display: none;">
                                <i class="fa-solid fa-xmark"></i>
                                Cancel
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </section>

        <!-- ================= PATIENT TABLE ================= -->
        <section class="content-grid single">

            <div class="card">

                <div class="card-header">
                    <h2>All Patients</h2>
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Address</th>
                            <th>Ward</th>
                        </tr>
                        </thead>

                        <tbody id="patientsTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>

<!-- ================= JQUERY ================= -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- ================= SIDEBAR ================= -->
<script src="js/sidebar.js"></script>

<!-- ================= SWEETALERT2 ================= -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ================= PATIENT ================= -->
<script src="js/custom/patient.js"></script>

</body>
</html>
