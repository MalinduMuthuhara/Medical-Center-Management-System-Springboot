<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/crud.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        app-sidebar {
            display: contents;
        }

        .account-info {
            display: flex;
            gap: 40px;
            padding: 4px 0 20px 0;
        }

        .account-info div span {
            display: block;
            font-size: 12px;
            color: #8a8fa3;
            margin-bottom: 4px;
        }

        .account-info div strong {
            font-size: 16px;
        }

        /* ===== Theme Toggle Switch ===== */
        .theme-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .theme-toggle-row div span {
            display: block;
            font-weight: 600;
            font-size: 15px;
        }

        .theme-toggle-row div small {
            color: #8a8fa3;
            font-size: 13px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #d6d9df;
            border-radius: 28px;
            transition: 0.2s ease;
        }

        .switch-slider::before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            border-radius: 50%;
            transition: 0.2s ease;
        }

        .switch input:checked + .switch-slider {
            background-color: #4f46e5;
        }

        .switch input:checked + .switch-slider::before {
            transform: translateX(22px);
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- ================= SIDEBAR ================= -->
    <app-sidebar active="settings"></app-sidebar>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">

        <!-- ================= HEADER ================= -->
        <header class="topbar">
            <div>
                <h1>Settings</h1>
                <p>Manage your account and system users.</p>
            </div>
        </header>

        <!-- ================= APPEARANCE ================= -->
        <section class="content-grid single">

            <div class="card">

                <div class="card-header">
                    <h2>Appearance</h2>
                </div>

                <div class="theme-toggle-row">

                    <div>
                        <span>Dark Theme</span>
                        <small>Switch the whole app between light and dark mode</small>
                    </div>

                    <label class="switch">
                        <input type="checkbox" id="themeToggle">
                        <span class="switch-slider"></span>
                    </label>

                </div>

            </div>

        </section>

        <!-- ================= MY ACCOUNT ================= -->
        <section class="content-grid single">

            <div class="card">

                <div class="card-header">
                    <h2>My Account</h2>
                </div>

                <div class="account-info">

                    <div>
                        <span>Username</span>
                        <strong id="accountUsername">-</strong>
                    </div>

                    <div>
                        <span>Role</span>
                        <strong id="accountRole">-</strong>
                    </div>

                </div>

            </div>

        </section>

        <!-- ================= CHANGE PASSWORD ================= -->
        <section class="content-grid single">

            <div class="card">

                <div class="card-header">
                    <h2>Change Password</h2>
                </div>

                <form id="changePasswordForm">

                    <div class="form-row">

                        <!-- Current Password -->
                        <div class="form-group">
                            <label for="oldPassword">Current Password</label>
                            <input type="password"
                                   id="oldPassword"
                                   placeholder="Enter current password"
                                   required>
                        </div>

                        <!-- New Password -->
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <input type="password"
                                   id="newPassword"
                                   placeholder="Enter new password"
                                   required>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="form-group">
                            <label for="confirmPassword">Confirm New Password</label>
                            <input type="password"
                                   id="confirmPassword"
                                   placeholder="Re-enter new password"
                                   required>
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-actions">

                            <button type="submit"
                                    onclick="handleChangePassword(event)"
                                    class="btn btn-primary">
                                <i class="fa-solid fa-key"></i>
                                Change Password
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </section>

        <!-- ================= USER MANAGEMENT (ADMIN ONLY) ================= -->
        <section class="content-grid single" id="userManagementSection" style="display: none;">

            <div class="card">

                <div class="card-header">
                    <h2>Add System User</h2>
                </div>

                <form id="addUserForm">

                    <div class="form-row">

                        <!-- Username -->
                        <div class="form-group">
                            <label for="newUserName">Username</label>
                            <input type="text"
                                   id="newUserName"
                                   placeholder="Enter username"
                                   required>
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label for="newUserPassword">Password</label>
                            <input type="password"
                                   id="newUserPassword"
                                   placeholder="Enter password"
                                   required>
                        </div>

                        <!-- Role -->
                        <div class="form-group">
                            <label for="newUserRole">Role</label>
                            <select id="newUserRole" required>
                                <option value="">Select Role</option>
                                <option value="ADMIN">Admin</option>
                                <option value="CASHIER">Cashier</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-actions">

                            <button type="submit"
                                    onclick="handleAddUser(event)"
                                    class="btn btn-primary">
                                <i class="fa-solid fa-user-plus"></i>
                                Add User
                            </button>

                        </div>

                    </div>

                </form>

            </div>

            <div class="card">

                <div class="card-header">
                    <h2>All System Users</h2>
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                        </thead>

                        <tbody id="userTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>

<!-- ================= JQUERY ================= -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- ================= SIDEBAR ================= -->
<script src="js/sidebar.js"></script>

<!-- ================= SWEETALERT2 ================= -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ================= SETTINGS ================= -->
<script src="js/custom/setting.js"></script>

</body>
</html>
