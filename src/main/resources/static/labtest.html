<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Tests</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/crud.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        app-sidebar {
            display: contents;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- ================= SIDEBAR ================= -->
    <app-sidebar active="labtests"></app-sidebar>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">

        <!-- ================= HEADER ================= -->
        <header class="topbar">
            <div>
                <h1>Lab Tests</h1>
                <p>View, add, edit, and remove lab tests.</p>
            </div>
        </header>

        <!-- ================= LAB TEST FORM ================= -->
        <section class="content-grid single">

            <div class="card">

                <div class="card-header">
                    <h2 id="formTitle">Add Lab Test</h2>
                </div>

                <form id="labTestForm">

                    <!-- Lab Test ID -->
                    <input type="hidden" id="labTestId" value="0">

                    <div class="form-row">

                        <!-- Appointment -->
                        <div class="form-group">
                            <label for="appointmentId">Appointment</label>
                            <select id="appointmentId" required>
                                <option value="">Select Appointment</option>
                            </select>
                        </div>

                        <!-- Test Name -->
                        <div class="form-group">
                            <label for="testName">Test Name</label>
                            <input type="text"
                                   id="testName"
                                   placeholder="Enter test name"
                                   required>
                        </div>

                    </div>

                    <div class="form-row">

                        <!-- Result -->
                        <div class="form-group">
                            <label for="result">Result</label>
                            <input type="text"
                                   id="result"
                                   placeholder="Enter test result"
                                   required>
                        </div>

                        <!-- Test Date -->
                        <div class="form-group">
                            <label for="testDate">Test Date</label>
                            <input type="date"
                                   id="testDate"
                                   required>
                        </div>

                    </div>

                    <!-- ================= BUTTONS ================= -->
                    <div class="form-row">

                        <div class="form-actions">

                            <!-- Save -->
                            <button type="submit"
                                    onclick="handleSave(event)"
                                    class="btn btn-primary"
                                    id="saveBtn">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save
                            </button>

                            <!-- Update -->
                            <button type="button"
                                    onclick="handleUpdate(event)"
                                    class="btn btn-success"
                                    id="updateBtn"
                                    style="display: none;">
                                <i class="fa-solid fa-pen-to-square"></i>
                                Update
                            </button>

                            <!-- Delete -->
                            <button type="button"
                                    onclick="handleDelete(event)"
                                    class="btn btn-danger"
                                    id="deleteBtn"
                                    style="display: none;">
                                <i class="fa-solid fa-trash"></i>
                                Delete
                            </button>

                            <!-- Cancel -->
                            <button type="button"
                                    onclick="handleCancel()"
                                    class="btn btn-dark"
                                    id="cancelBtn"
                                    style="display: none;">
                                <i class="fa-solid fa-xmark"></i>
                                Cancel
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </section>

        <!-- ================= LAB TEST TABLE ================= -->
        <section class="content-grid single">

            <div class="card">

                <div class="card-header">
                    <h2>All Lab Tests</h2>
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Appointment</th>
                            <th>Test Name</th>
                            <th>Result</th>
                            <th>Date</th>
                        </tr>
                        </thead>

                        <tbody id="labTestTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>

<!-- ================= JQUERY ================= -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- ================= SIDEBAR ================= -->
<script src="js/sidebar.js?v=2"></script>

<!-- ================= SWEETALERT2 ================= -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ================= LAB TEST ================= -->
<script src="js/custom/labtest.js"></script>

</body>
</html>
