spring.application.name=Medical Center Management System Spring

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/medical_center_aad?createDatabaseIfNotExist=true
spring.datasource.username=admin
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=ThisIsASecretKeyForJwtAuthenticationMustBeAtLeast256Bits
jwt.expiration=86400000